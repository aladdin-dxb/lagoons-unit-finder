<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#15211f; --surface-2:#1c2a27; --line:#2b3c38;
  --fg:#e5eeec; --muted:#91a5a0; --accent:#4fb6bf; --accent-soft:#143a3d;
  --sand:#e0b25e; --up:#5fca8b; --down:#f07a6f; --marker:#ff5a4c; --warn-soft:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#15211f; --surface-2:#1c2a27; --line:#2b3c38;
  --fg:#e5eeec; --muted:#91a5a0; --accent:#4fb6bf; --accent-soft:#143a3d;
  --sand:#e0b25e; --up:#5fca8b; --down:#f07a6f; --marker:#ff5a4c; --warn-soft:#3a3018; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1320px;margin:0 auto;padding-inline:18px;padding-block:18px 48px;display:grid;gap:16px}
.wrap[lang="zh"]{--f-display:"Noto Sans SC",system-ui,sans-serif;--f-body:"Noto Sans SC",system-ui,sans-serif}
.wrap[lang="en"]{--f-display:"Readex Pro",system-ui,sans-serif;--f-body:"IBM Plex Sans Arabic",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}

.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.srow label{font-weight:600}

.fig .lbl{font-size:.78rem;color:var(--muted);font-weight:600}

.fig .note{font-size:.76rem;color:var(--muted)}
.fig.key{background:var(--accent-soft)} .fig.key .val{color:var(--accent)}
.fig.est{background:var(--warn-soft);outline:1px dashed var(--down)} .fig.est .val{color:var(--down)} .fig.est .lbl,.fig.est .note{color:var(--down)}
.estwhy{color:var(--down);font-size:.76rem;line-height:1.5;margin:0}
.up{color:var(--up)} .down{color:var(--down)}

.tbl{overflow-x:auto}

.pill.d{border-color:var(--accent);color:var(--accent)}
.empty{color:var(--muted);font-size:.88rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.types{display:grid;gap:6px;font-size:.86rem}
.tlist{display:grid;gap:10px}
.trow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.thd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.thd i{width:14px;height:10px;border-radius:2px;border:1px solid var(--line);flex:none}

.per .pc{display:inline-flex;align-items:center;gap:6px}.per .pc input{font:500 .82rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:3px 8px}.per .pc[hidden]{display:none}
.per button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.figs3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.figs3 .fig{padding:7px 9px;gap:1px}
.figs3 .fig .lbl{font-size:.7rem}

.figs3 .fig .note{font-size:.68rem;line-height:1.35}
@media (max-width:520px){.figs3 .fig{padding:6px 7px}.figs3 .fig .val{font-size:.82rem}.figs3 .fig .note{font-size:.64rem}}
.trow[data-k]{cursor:pointer;transition:border-color .15s}
.trow[data-k]:hover{border-color:var(--accent)}
.back{font:600 .86rem var(--f-body);border:0;background:none;color:var(--accent);cursor:pointer;padding:0;justify-self:start;text-decoration:underline;text-underline-offset:3px}
.flt{display:flex;gap:6px;flex-wrap:wrap}
.flt button{font:600 .8rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 11px;cursor:pointer}
.flt button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
tr.tx{cursor:pointer} tr.tx td{padding:6px 6px;vertical-align:top} tr.tx td:nth-child(3) .pct{white-space:nowrap}
.pct{display:block;font-size:.74rem;font-weight:600} tr.tx:hover td{background:var(--surface-2)}
tr.tx.ex td{color:var(--muted)}
.pill.ex{border-style:dashed}
.area{fill:rgba(224,56,43,.08);stroke:var(--marker);stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
tr.tx.on td{background:var(--accent-soft)}
.ulink{font:600 .86rem var(--f-num);border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.types div{display:flex;gap:8px;align-items:center}
.types i{width:14px;height:10px;border-radius:2px;border:1px solid var(--line);flex:none}
.viewer-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.crumb{display:flex;gap:6px;align-items:center;font-size:.92rem;font-weight:600;flex-wrap:wrap}
.crumb button{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.tools{display:flex;gap:6px;direction:ltr}
.tools button{font-family:var(--f-num);font-size:.9rem;min-width:34px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:6px;padding:4px 10px;cursor:pointer}
.viewport{position:relative;overflow:hidden;border-radius:8px;background:var(--surface-2);touch-action:none;cursor:grab;direction:ltr;height:min(72vh,640px);max-width:100%}
.viewport.drag{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage.anim{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.stage img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.poly{fill:rgba(11,102,112,.10);stroke:var(--accent);stroke-width:3;cursor:pointer;transition:fill .15s}
.poly:hover,.poly.on{fill:rgba(11,102,112,.32)}
.poly.plan{stroke:var(--sand);fill:rgba(183,131,42,.10)} .poly.plan:hover,.poly.plan.on{fill:rgba(183,131,42,.3)}
.plabel{font-family:var(--f-display);font-size:24px;font-weight:600;fill:#0b3f45;paint-order:stroke;stroke:#fff;stroke-width:6px;pointer-events:none}
.pin{position:absolute;width:0;height:0;pointer-events:none}
.pin::before{content:"";position:absolute;width:calc(var(--r,14px)*2);height:calc(var(--r,14px)*2);left:calc(var(--r,14px)*-1);top:calc(var(--r,14px)*-1);border-radius:50%;border:4px solid #1d4ed8;box-shadow:0 0 0 3px rgba(255,255,255,.9),inset 0 0 0 2px rgba(255,255,255,.9)}
.pin::after{content:"";position:absolute;width:calc(var(--r,14px)*3.6);height:calc(var(--r,14px)*3.6);left:calc(var(--r,14px)*-1.8);top:calc(var(--r,14px)*-1.8);border-radius:50%;border:3px solid #1d4ed8;opacity:.6;animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(.6);opacity:.8}to{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::after{animation:none}.stage.anim{transition:none}}
.loc{font-size:.84rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;line-height:1.7}
.dlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dlbtn{display:inline-flex;align-items:center;gap:8px}
.dlbtn[disabled]{opacity:.6;cursor:progress}
.dlbtn svg{width:16px;height:16px;flex:none}
#dlmsg{font-size:.85rem;color:var(--muted)} #dlmsg.err{color:var(--down)}
.pdfrep{--bg:#ffffff;--surface:#ffffff;--surface-2:#eef3f2;--line:#d3ddda;--fg:#13201e;--muted:#566864;--accent:#0b6670;--accent-soft:#d9eef0;--sand:#a5741f;--up:#1c7a45;--down:#b3392f;--warn-soft:#f8efdc;
  position:absolute;left:-10000px;top:0;width:794px;background:#fff;color:#13201e;padding:30px 36px 24px;display:grid;gap:16px;font-family:var(--f-body);font-size:14px;line-height:1.55;color-scheme:light}
.pdfrep[lang="zh"]{--f-display:"Noto Sans SC",sans-serif;--f-body:"Noto Sans SC",sans-serif}
.pdfrep[lang="en"]{--f-display:"Readex Pro",sans-serif;--f-body:"IBM Plex Sans Arabic",sans-serif}
.pdfhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;border-bottom:3px solid #0b6670;padding-bottom:10px}
.pdfhead .k{font:600 12px var(--f-body);letter-spacing:.06em;color:#0b6670;text-transform:uppercase}
.pdfhead h1{font-size:24px;margin:2px 0 0}
.pdfhead .m{font-size:12px;color:#566864;text-align:end;line-height:1.6}
.pdfmap{display:block;margin:0 auto;border:1px solid #d3ddda;border-radius:8px}
.pdfrep .sheet{border:0;padding:0;background:none;gap:12px}
.pdfrep .figs{grid-template-columns:repeat(2,minmax(0,1fr))}

.pdfrep[lang="ar"] .pdfhead .k{letter-spacing:0;text-transform:none}
.pdfrep .figs3 .fig{padding:7px 9px} .pdfrep .figs3 .fig .val{font-size:.95rem} .pdfrep .figs3 .fig .note{font-size:.68rem}
.pdfrep th{padding:6px 8px} .pdfrep td,.pdfrep tr.tx td{padding:5px 8px}
.pdfrep .pct{display:inline;margin-inline-start:6px}

@media (max-width:520px){.sheet{padding:14px}tr.tx td,.tbl th{padding:6px 4px}.figs{grid-template-columns:minmax(0,1fr)}.viewport{height:62vh}}
</style>

<div class="wrap" id="app" dir="ltr" lang="en">
  <header>
    <div>
      <h1 id="h1"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-l="en" aria-pressed="true">English</button>
      <button type="button" data-l="ar" aria-pressed="false">العربية</button>
      <button type="button" data-l="zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <form class="search" id="f" autocomplete="off">

    <div class="dlrow"><button type="button" class="btn dlbtn" id="dlpdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg><span id="dllbl"></span></button><span id="dlmsg" role="status"></span></div>
    <div class="legend">
      <span><i style="background:var(--up)"></i><b id="lg1" style="font-weight:400"></b></span>
      <span><i style="background:var(--accent)"></i><b id="lg2" style="font-weight:400"></b></span>
      <span><i style="background:var(--sand)"></i><b id="lg3" style="font-weight:400"></b></span>

  <div class="main">

          <div class="pin" id="pin" hidden></div>

    </section>
  </div>

  <footer id="foot"></footer>
</div>

let L="en";
try{const s=localStorage.getItem("lagoons_lang2");if(I[s])L=s}catch(e){}
const t=k=>I[L][k];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const fmtR=(lo,hi)=>{if(Math.round(lo)===Math.round(hi))return fmtM(lo);if(lo>=1e6&&hi>=1e6){const f=x=>(x/1e6).toFixed(2).replace(/\.?0+$/,"");return f(lo)+"–"+f(hi)+"M"}if(lo<1e6&&hi<1e6)return Math.round(lo/1e3)+"–"+Math.round(hi/1e3)+"K";return fmtM(lo)+"–"+fmtM(hi)};
const fmtM=v=>v==null?"—":(v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,"")+"M":Math.round(v/1e3)+"K");
const full=v=>v==null?"—":Math.round(v).toLocaleString("en-US");
const mon=d=>{if(!d)return"—";const [y,m,dd]=d.split("-");const M=t("months")[+m-1];return L==="zh"?`${y}年${M}${dd?(+dd)+"日":""}`:(dd?(+dd)+" ":"")+M+" "+y};
const nm=c=>c.name?c.name[L]:c.ar;
const tx=o=>o==null?"":(typeof o==="object"?(o[L]||o.ar):o);

let D=null, view="master", sel=null;
const T={s:1,x:0,y:0,base:1,w:1,h:1};

/* ---------- viewer ---------- */
function setImage(src,w,h,alt){
  const img=$("img"); img.alt=alt; if(img.getAttribute("src")!==src) img.src=src;
  const st=$("stage"); st.style.width=w+"px"; st.style.height=h+"px";
  T.w=w;T.h=h; $("ov").setAttribute("viewBox",`0 0 ${w} ${h}`);
  fit(false);
}
function apply(anim){const st=$("stage");st.classList.toggle("anim",!!anim);st.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.s})`}
function clampT(){const vp=$("vp"),W=vp.clientWidth,H=vp.clientHeight,sw=T.w*T.s,sh=T.h*T.s;
  T.x=sw<=W?(W-sw)/2:Math.min(0,Math.max(W-sw,T.x)); T.y=sh<=H?(H-sh)/2:Math.min(0,Math.max(H-sh,T.y));}
function fit(anim){const vp=$("vp");T.base=Math.min(vp.clientWidth/T.w,vp.clientHeight/T.h);T.s=T.base;clampT();apply(anim)}
function zoomAt(f,cx,cy,anim){const ns=Math.min(T.base*12,Math.max(T.base,T.s*f));const k=ns/T.s;T.x=cx-(cx-T.x)*k;T.y=cy-(cy-T.y)*k;T.s=ns;clampT();apply(anim)}
function focus(x,y,mult){const vp=$("vp");T.s=Math.min(T.base*12,T.base*(mult||4));T.x=vp.clientWidth/2-x*T.s;T.y=vp.clientHeight/2-y*T.s;clampT();apply(true)}
(function(){
  const vp=$("vp");let drag=null,moved=0;const pts=new Map();let pinch=null;
  vp.addEventListener("pointerdown",e=>{vp.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])};drag=null}
    else{drag={x:e.clientX,y:e.clientY,tx:T.x,ty:T.y};moved=0}});
  vp.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);
    if(pinch&&pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=vp.getBoundingClientRect();
      zoomAt(d/pinch.d,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top,false);pinch.d=d;moved=99;return}
    if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    if(moved>4){vp.classList.add("drag");T.x=drag.tx+dx;T.y=drag.ty+dy;clampT();apply(false)}});
  const end=e=>{const wasClick=drag&&moved<=4&&pts.size===1;pts.delete(e.pointerId);if(pts.size<2)pinch=null;vp.classList.remove("drag");
    if(wasClick)clickAt(e);drag=null};
  vp.addEventListener("pointerup",end);vp.addEventListener("pointercancel",e=>{pts.delete(e.pointerId);drag=null;pinch=null});
  vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.25:0.8,e.clientX-r.left,e.clientY-r.top,false)},{passive:false});
  $("zin").onclick=()=>{const v=$("vp");zoomAt(1.5,v.clientWidth/2,v.clientHeight/2,true)};
  $("zout").onclick=()=>{const v=$("vp");zoomAt(1/1.5,v.clientWidth/2,v.clientHeight/2,true)};
  $("zfit").onclick=()=>fit(true);

    const k=c.keyOf(p,n);if(k!=null&&c.units[k])hits.push([id,k]);}
  if(hits.length===1)return {hit:hits[0]};
  if(hits.length)return {cands:hits};
  if(p){const id=D.order.find(i=>D.C[i].pref.includes(p));if(id)return {cluster:id,code:p+n,cands:[]}}
  return {cands:[]};
}

}

/* what the map viewer shows now, with outlines and the unit pin */
async function mapShot(){
  const img=$("img"); try{if(!img.complete)await img.decode()}catch(e){}
  if(!img.naturalWidth) return null;
  /* region: around the unit, around the type's units, or the whole plan */
  let x0=0,y0=0,x1=T.w,y1=T.h;const c=view==="master"?null:D.C[view];
  const fitAsp=(cx,cy,w,h,asp)=>{if(w/h<asp)w=h*asp;else h=w/asp;w=Math.min(w,T.w);h=Math.min(h,T.h);
    let a=Math.max(0,Math.min(T.w-w,cx-w/2)),b=Math.max(0,Math.min(T.h-h,cy-h/2));return [a,b,a+w,b+h]};
  const u=c&&sel?c.units[sel]:null;
  if(u&&u.xy){const nn=nnOf(c)||20;[x0,y0,x1,y1]=fitAsp(u.xy[0],u.xy[1],nn*40,nn*18,722/360)}
  else if(c&&selType&&typeof typeP!=="undefined"&&typeP.length){const pad=(nnOf(c)||20)*3;let a=1e9,b=1e9,e=-1e9,f=-1e9;
    typeP.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);e=Math.max(e,p[0]);f=Math.max(f,p[1])});
    [x0,y0,x1,y1]=fitAsp((a+e)/2,(b+f)/2,e-a+2*pad,f-b+2*pad,722/520)}
  const sw=x1-x0,sh=y1-y0; if(sw<=0||sh<=0) return null;
  const k=Math.min(1700/sw,1700/sh,img.naturalWidth/T.w*1.5);
  const cv=document.createElement("canvas");cv.width=Math.round(sw*k);cv.height=Math.round(sh*k);
  const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
  const fx=img.naturalWidth/T.w,fy=img.naturalHeight/T.h;
  g.drawImage(img,x0*fx,y0*fy,sw*fx,sh*fy,0,0,cv.width,cv.height);
  const P=(x,y)=>[(x-x0)*k,(y-y0)*k];
  $("ov").querySelectorAll("polygon").forEach(p=>{
    const pts=(p.getAttribute("points")||"").trim().split(/\s+/).map(q=>q.split(",").map(Number));if(pts.length<3)return;
    g.beginPath();pts.forEach((q,i)=>{const [a,b]=P(q[0],q[1]);i?g.lineTo(a,b):g.moveTo(a,b)});g.closePath();
    if(p.classList.contains("area")){g.fillStyle="rgba(224,56,43,.10)";g.strokeStyle="#e0382b";g.lineWidth=Math.max(3,Math.min(8,1.6*k))}
    else{const pl=p.classList.contains("plan"),on=p.classList.contains("on");
      g.fillStyle=pl?`rgba(183,131,42,${on?.3:.1})`:`rgba(11,102,112,${on?.32:.1})`;g.strokeStyle=pl?"#b7832a":"#0b6670";g.lineWidth=3*k}
    g.lineJoin="round";g.fill();g.stroke()});
  $("ov").querySelectorAll("text").forEach(tn=>{const [a,b]=P(+tn.getAttribute("x"),+tn.getAttribute("y"));
    g.font=`600 ${24*k}px "Readex Pro","IBM Plex Sans Arabic","Noto Sans SC",sans-serif`;g.textAlign="center";
    g.lineWidth=6*k;g.strokeStyle="#fff";g.lineJoin="round";g.strokeText(tn.textContent,a,b);g.fillStyle="#0b3f45";g.fillText(tn.textContent,a,b)});
  if(!$("pin").hidden&&sel&&view!=="master"){const c=D.C[view],u=c.units[sel];
    if(u&&u.xy){const r=Math.max(12,Math.min(40,nnOf(c)*1.5))*k;const [a,b]=P(u.xy[0],u.xy[1]);
      g.lineWidth=Math.max(4,r*.28);g.strokeStyle="#fff";g.beginPath();g.arc(a,b,r,0,7);g.stroke();
      g.lineWidth=Math.max(3,r*.2);g.strokeStyle="#1d4ed8";g.beginPath();g.arc(a,b,r,0,7);g.stroke();
      g.lineWidth=Math.max(2,r*.1);g.globalAlpha=.6;g.beginPath();g.arc(a,b,r*1.7,0,7);g.stroke();g.globalAlpha=1}}
  return {src:cv.toDataURL("image/jpeg",.9),w:cv.width,h:cv.height};
}

async function makePdf(){
  const btn=$("dlpdf"),msg=$("dlmsg");if(btn.disabled||!D)return;
  btn.disabled=true;msg.className="";msg.textContent=dt("wait");
  let box=null;const keepN=txN;
  try{
    try{await pdfLibs()}catch(e){msg.className="err";msg.textContent=dt("net");return}
    try{await document.fonts.ready}catch(e){}
    /* type view: put more transactions in the file than the screen shows */
    let shownNote="";
    if(selType&&!sel&&view!=="master"){const all=live(view)?txList(view,selType).filter(x=>txF==="all"||x.t===txF):[];
      txN=Math.max(keepN,100);renderType();if(all.length>txN)shownNote=dt("shown")(txN,all.length)}
    const shot=await mapShot();const ti=reportTitle();
    const sheet=cleanSheet();
    if(txN!==keepN){txN=keepN;renderType()}
    box=document.createElement("div");box.className="pdfrep";box.dir=t("dir");box.lang=L;
    const today=new Date().toISOString().slice(0,10);
    box.innerHTML=`<div class="pdfhead"><div><div class="k">DAMAC Lagoons · ${esc(dt("kind"))}</div><h1>${esc(ti.h)}</h1></div>
      <div class="m"><div>${esc(t("lper"))}: ${esc(perLbl())}</div>${D.updated?`<div>${esc(t("upd")||"")}${esc(mon(D.updated))}</div>`:""}<div>${esc(dt("made"))}: ${esc(mon(today))}</div></div></div>`;
    if(shot){const maxW=722,maxH=520;let w=maxW,h=maxW*shot.h/shot.w;if(h>maxH){h=maxH;w=maxH*shot.w/shot.h}
      const im=new Image();im.className="pdfmap";im.src=shot.src;im.width=Math.round(w);im.height=Math.round(h);im.style.width=Math.round(w)+"px";im.style.height=Math.round(h)+"px";
      try{await im.decode()}catch(e){} box.appendChild(im)}
    box.appendChild(sheet);
    if(shownNote){const p=document.createElement("p");p.className="tbasis";p.textContent=shownNote;box.appendChild(p)}
    const ft=document.createElement("div");ft.className="pdffoot";ft.textContent=t("foot");box.appendChild(ft);
    document.body.appendChild(box);
    await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

    /* page breaks only between blocks or table rows */
    const bt=box.getBoundingClientRect().top,TH=box.scrollHeight;
    const cuts=new Set([TH]);
    box.querySelectorAll(".pdfhead,.pdfmap,.figs,.figs3,.kv,.kv dd,.box,.trow,tbody tr,.tbl,.types>div,.estwhy,.tbasis,.pdffoot,.sheet>*").forEach(e=>{const r=e.getBoundingClientRect();if(r.height)cuts.add(Math.round(r.bottom-bt))});
    const C=[...cuts].sort((a,b)=>a-b);
    const PW=794,PH=1123,M=26,avail=PH-2*M;
    const pages=[];let s=0;
    while(s<TH-40){let e=s;for(const y of C){if(y>s&&y<=s+avail)e=y}if(e<=s)e=Math.min(TH,s+avail);pages.push([s,e]);s=e}

    const scale=Math.max(1,Math.min(2,Math.sqrt(14e6/(PW*TH))));
    const cvs=await window.html2canvas(box,{scale,backgroundColor:"#ffffff",useCORS:true,logging:false,width:PW,height:TH});
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4",compress:true});
    const mm=210/PW;
    pages.forEach(([a,b],i)=>{if(i)doc.addPage();
      const pc=document.createElement("canvas");pc.width=Math.round(PW*scale);pc.height=Math.max(1,Math.round((b-a)*scale));
      const g=pc.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,pc.width,pc.height);
      g.drawImage(cvs,0,Math.round(a*scale),pc.width,pc.height,0,0,pc.width,pc.height);
      doc.addImage(pc.toDataURL("image/jpeg",.92),"JPEG",0,M*mm,210,(b-a)*mm,undefined,"FAST");
      doc.setFontSize(8);doc.setTextColor(120);doc.text(`${i+1} / ${pages.length}`,105,292,{align:"center"})});
    const name=`${ti.f}_${PER==="c"?CF+"_"+CT:PER+"m"}_${L.toUpperCase()}_${today}.pdf`.replace(/[^\w.\-]+/g,"_");
    const blob=doc.output("blob");

    let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
    if(dl){
      try{const r=await dl.save({filename:name,data:blob});msg.textContent=r&&r.status==="delivered"?"":dt("ok")}
      catch(e){const code=e&&e.code;
        if(code==="declined"){msg.textContent=dt("decl")}
        else if(code==="rate_limited"){msg.textContent=""}
        else{try{doc.save(name);msg.textContent=""}catch(_){msg.className="err";msg.textContent=dt("fail")}}}
    } else {doc.save(name);msg.textContent=""}
  }catch(e){console.error(e);msg.className="err";msg.textContent=dt("fail");if(txN!==keepN){txN=keepN;renderType()}}
  finally{if(box)box.remove();btn.disabled=false}
}
